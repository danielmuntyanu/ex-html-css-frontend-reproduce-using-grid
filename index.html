<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F5 - Grid</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/typography.css">

</head>
<body>
    <main>
        <h1>Colores de fondo</h1>
        <h2>Colores</h2>
        <section class="main-container">
            <div class="colors-title-item">Colors</div>
            <div class="colors-list">
                <div id="black" class="color-item">black</div>
                <div id="teal" class="color-item">teal</div>
                <div id="blue" class="color-item">blue</div>
                <div id="navy" class="color-item">navy</div>
                <div id="lime" class="color-item">lime</div>
                <div id="white" class="color-item">white</div>
                <div id="purple" class="color-item">purple</div>
                <div id="yellow" class="color-item">yellow</div>
                <div id="olive" class="color-item">olive</div>
                <div id="red" class="color-item">red</div>
                <div id="maroon" class="color-item">maroon</div>
                <div id="gray" class="color-item">gray</div>
                <div id="olivedrab" class="color-item">olivedrab</div>
                <div id="deepskyblue" class="color-item">deep sky blue</div>
                <div id="fuchsia" class="color-item">fuchsia</div>
                <div id="green" class="color-item">green</div>
            </div>
        </section>
    </main>

</html>
