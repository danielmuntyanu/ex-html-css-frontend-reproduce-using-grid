<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F5 - Grid</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/typography.css">

</head>
<body>
    <main>
        <h1>Colores de fondo</h1>
        <h2>Colores</h2>
        <section class="main-container">
            <div id="title-item" class="color-item">Colors</div>
            <div class="colors-list">
                <div id="black-item" class="color-item">black</div>
                <div id="teal-item" class="color-item">teal</div>
                <div id="blue-item" class="color-item">blue</div>
                <div id="navy-item" class="color-item">navy</div>
                <div id="lime-item" class="color-item">lime</div>
                <div id="white-item" class="color-item">white</div>
                <div id="purple-item" class="color-item">purple</div>
                <div id="yellow-item" class="color-item">yellow</div>
                <div id="olive-item" class="color-item">olive</div>
                <div id="red-item" class="color-item">red</div>
                <div id="maroon-item" class="color-item">maroon</div>
                <div id="gray-item" class="color-item">gray</div>
                <div id="olivedrab-item" class="color-item">olivedrab</div>
                <div id="deepskyblue-item" class="color-item">deep sky blue</div>
                <div id="fuchsia-item" class="color-item">fuchsia</div>
                <div id="green-item" class="color-item">green</div>
            </div>
        </section>
    </main>
</body>
</html>
